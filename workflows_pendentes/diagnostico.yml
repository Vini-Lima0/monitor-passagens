name: Diagnóstico (comparar navegadores)

# Rode manualmente (aba Actions → Run workflow) para conferir se o servidor vê os mesmos
# preços que o seu navegador.
on: workflow_dispatch

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Comparar navegadores
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python diagnostico.py

      - name: Guardar prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-diagnostico
          path: dados/erros/
          if-no-files-found: ignore
          retention-days: 3
